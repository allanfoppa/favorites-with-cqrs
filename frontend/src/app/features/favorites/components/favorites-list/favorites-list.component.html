<mat-toolbar class="main-toolbar">
  <button mat-icon-button>
    <mat-icon>menu</mat-icon>
  </button>

  <span class="title">Favorites Hub</span>

  <span class="spacer"></span>

  <button mat-fab color="primary" class="fab">
    <mat-icon>add</mat-icon>
  </button>
</mat-toolbar>

<div class="content-container">
  <!-- Search -->
  <mat-form-field appearance="outline" class="search-field">
    <mat-icon matPrefix>search</mat-icon>
    <input matInput placeholder="Buscar favoritos..." (input)="handleSearch($event)" />
  </mat-form-field>

  <!-- Summary -->
  <mat-card class="summary-card">
    <div class="summary-content">
      <div class="icon-circle">
        <mat-icon>star</mat-icon>
      </div>

      <div>
        <p class="label">Total de favoritos</p>
        <p class="value">{{ store.totalCount() }}</p>
      </div>
    </div>
  </mat-card>

  <!-- Grid -->
  <div class="favorites-grid">
    @for (favorite of store.filteredFavorites(); track favorite.id) {
      <app-favorite-card [data]="favorite" (delete)="store.removeFavorite($event)" />
    }
  </div>
</div>

@if (isModalOpen()) {
  <app-add-favorite-form (close)="closeModal()" (save)="store.addFavorite($event); closeModal()" />
}
