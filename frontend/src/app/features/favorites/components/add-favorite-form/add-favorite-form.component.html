<div class="modal-content">
  <header class="modal-header">
    <h2 id="modal-title">Add New Favorite</h2>
    <button type="button" class="btn-close" (click)="close.emit()" aria-label="Close modal">
      &times;
    </button>
  </header>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form-group">
      <label for="favorite-title">Title</label>
      <input
        id="favorite-title"
        type="text"
        formControlName="title"
        placeholder="Example: Google"
        [attr.aria-invalid]="form.get('title')?.invalid && form.get('title')?.touched"
      />
      @if (form.get('title')?.touched && form.get('title')?.errors?.['required']) {
        <span class="error-message" role="alert">Title is required.</span>
      }
    </div>

    <div class="form-group">
      <label for="favorite-url">URL</label>
      <input
        id="favorite-url"
        type="url"
        formControlName="url"
        placeholder="https://google.com"
        [attr.aria-invalid]="form.get('url')?.invalid && form.get('url')?.touched"
      />
      @if (form.get('url')?.touched && form.get('url')?.errors?.['pattern']) {
        <span class="error-message" role="alert">Please enter a valid URL.</span>
      }
    </div>

    <footer class="form-actions">
      <button type="button" class="btn-secondary" (click)="close.emit()">Cancel</button>
      <button type="submit" class="btn-primary" [disabled]="form.invalid">Save Favorite</button>
    </footer>
  </form>
</div>
